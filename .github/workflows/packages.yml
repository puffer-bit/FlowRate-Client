# Publishes the client libraries to nuget.org as the FlowRate.* packages, on a tag sdk-v<version>
# (sdk-v0.1.0, sdk-v0.2.0-preview.1): every package with that version, see
# src/Client/Client.Package/README.md. The tests run first; a version already on nuget.org is skipped.
#
# Publishes through nuget.org Trusted Publishing, with no stored API key: GitHub gives the job an OIDC
# token, which nuget.org exchanges for a key valid for an hour. Needs, once:
# - on nuget.org, Trusted Publishing: a policy for owner puffer-bit, repository FlowRate-Client,
#   workflow file packages.yml, no environment;
# - the secret NUGET_USER: the nuget.org profile name (not the email) that owns the policy.
name: Packages

on:
  push:
    tags:
      - sdk-v*

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/tests.yml

  publish:
    name: Pack and publish
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The OIDC token nuget.org exchanges for a temporary API key
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          # The same as tests.yml
          dotnet-version: 10.0.402

      - name: Version
        id: version
        run: |
          version=${GITHUB_REF_NAME#sdk-v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not sdk-v<major>.<minor>.<patch>[-<suffix>]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: bash src/Scripts/bash/pack.sh "${{ steps.version.outputs.version }}" artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages

      # Right before the push: the key it returns is valid for an hour
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # The symbol packages (.snupkg) next to them go along
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
