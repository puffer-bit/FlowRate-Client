# Builds the desktop client for Linux and Windows and publishes it as a GitHub release, run by hand from the
# Actions tab: by default the pre-release v<version>-dev.<UTC yyMMddHHmm>, which clients set to the dev builds
# update to; with prerelease off the release v<version>, which becomes the latest one and reaches every client.
#
# The build is build.yml; both platforms go to one release under one tag, on the commit that was built.
# The description is the one GitHub generates (the changes since the previous release); nothing goes
# into the packages.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release (v<version>-dev.<date>); off publishes v<version> as the latest release
        type: boolean
        default: true
      aot:
        description: Compile ahead of time (NativeAOT) instead of the JIT build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      aot: ${{ inputs.aot }}
      dev: ${{ inputs.prerelease }}

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The files of both platforms side by side, as the release holds them
      - uses: actions/download-artifact@v8
        with:
          pattern: FlowRateClient-${{ needs.build.outputs.version }}-*
          path: assets
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ $PRERELEASE == true ]]; then kind=--prerelease; else kind=--latest; fi
          ls -l assets
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              "$kind" --title "FlowRate $VERSION" --generate-notes
          echo "### [FlowRate $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
