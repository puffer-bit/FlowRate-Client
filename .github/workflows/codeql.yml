# Code scanning with CodeQL: the C# code and the workflows themselves. The findings go to the Security tab
# and to the pull requests.
#
# Nothing is built (build-mode none): CodeQL reads the C# sources as they are, so neither the GStreamer
# runtime nor the android workload is needed. The submodule is checked out, its code is part of the client.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New queries of CodeQL find issues in code that did not change
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default queries and the security ones beyond them
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
