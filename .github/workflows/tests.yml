# Runs the test projects on every push and pull request, including before a release.
#
# Only the test projects are built, not FlowRateClient.sln: the desktop app needs the GStreamer runtime,
# which is not in git (see src/Client/Client.GStreamer/Build/README.md), and the Android app needs the
# android workload. None of the tests depends on either.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned so that a runner image migration does not change the build unannounced
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          # 10.0.403 was announced before its files could be downloaded (HTTP 409); back to 10.0.x once they can
          dotnet-version: 10.0.402

      - name: Test
        working-directory: src
        env:
          TEST_LABEL: Tests (${{ matrix.os }})
        run: bash ../.github/scripts/test-dotnet.sh Client/*.Tests/*.Tests.csproj Shared/Shared.Tests/Shared.Tests.csproj

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
