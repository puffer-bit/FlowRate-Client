# Runs the test projects on every push and pull request.
#
# Only the test projects are built, not FlowRateClient.sln: the desktop app needs the GStreamer runtime,
# which is not in git (see src/Client/Client.GStreamer/Build/README.md), and the Android app needs the
# android workload. None of the tests depends on either.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned so that a runner image migration does not change the build unannounced
        os: [ubuntu-24.04, windows-2025]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: bash
        working-directory: src
        run: |
          status=0
          printf '### Tests (${{ matrix.os }})\n\n' >> "$GITHUB_STEP_SUMMARY"
          for project in Client/*.Tests/*.Tests.csproj Shared/Shared.Tests/Shared.Tests.csproj; do
              echo "::group::$project"
              dotnet test "$project" -c Release --logger "trx;LogFilePrefix=$(basename "$project" .csproj)" \
                  --results-directory "$GITHUB_WORKSPACE/TestResults" 2>&1 | tee "$RUNNER_TEMP/test.log" || status=1
              # The "Passed!"/"Failed!" totals of each test assembly go to the run summary
              grep -E '^(Passed|Failed)!' "$RUNNER_TEMP/test.log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
              echo "::endgroup::"
          done
          exit $status

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
